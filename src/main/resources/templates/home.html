
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staging GUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #e6edf3; font-family: 'Courier New', monospace; min-height: 100vh; }
        .hero { min-height: 80vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
        .logo-hex { font-size: 5rem; color: #e94560; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        .title { font-size: 3rem; font-weight: 900; letter-spacing: 6px; color: #fff; }
        .subtitle { color: #8b949e; letter-spacing: 3px; font-size: 0.85rem; margin-top: 0.5rem; }
        .btn-start { background: #e94560; border: none; padding: 14px 48px; font-family: 'Courier New', monospace; font-weight: bold; letter-spacing: 2px; font-size: 1rem; border-radius: 4px; color: #fff; transition: all 0.3s; }
        .btn-start:hover { background: #c73652; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.4); color: #fff; }
        .divider { width: 60px; height: 3px; background: #e94560; margin: 1.5rem auto; }
    </style>
</head>
<body>
<div class="hero">
    <div class="logo-hex">⬡</div>
    <div class="title">STAGING GUI</div>
    <div class="divider"></div>
    <p style="color: #8b949e; max-width: 400px; font-size: 0.9rem; line-height: 1.8;">
        Cisco Catalyst 9000 ZTP Provisioning
    </p>
    <a href="/project" class="btn btn-start mt-3">START PROJECT</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
