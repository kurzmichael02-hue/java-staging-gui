<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit log - Staging GUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; min-height: 100vh; }
        .card { border: none; border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; background: #0f172a; }
        .table thead th { background: #f8fafc; color: #64748b; font-size: 0.72rem; font-weight: 700;
                          letter-spacing: 1px; text-transform: uppercase; border-color: #e2e8f0;
                          padding: 12px 16px; }
        .table tbody td { padding: 10px 16px; vertical-align: middle; font-size: 0.85rem;
                          border-color: #f1f5f9; }
        .ts { color: #94a3b8; font-family: 'Courier New', monospace; font-size: 0.78rem; white-space: nowrap; }
        .actor { font-weight: 600; color: #1e293b; }
        .target { font-family: 'Courier New', monospace; color: #2563eb; }
        .details { color: #64748b; font-size: 0.82rem; }
        .action-pill { padding: 3px 10px; border-radius: 4px; font-size: 0.72rem; font-weight: 700;
                       letter-spacing: 0.5px; white-space: nowrap; }
        .a-CREATED  { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
        .a-STARTED  { background: #fef9c3; color: #92400e; border: 1px solid #fde047; }
        .a-FINISHED { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .a-FAILED, .a-MARKED_ERROR { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .a-RETRIED  { background: #fef3c7; color: #854d0e; border: 1px solid #fcd34d; }
        .a-DELETED  { background: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .a-BULK     { background: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; }
    </style>
</head>
<body>

<nav th:replace="~{navbar :: navbar('devices')}"></nav>

<div class="container" style="max-width: 1100px;">

    <div th:if="${project != null}" class="alert alert-light border mb-3 py-2 px-3">
        <small class="text-muted">Project: <b th:text="${project.projectTitle}"></b>
            &nbsp;|&nbsp; Customer: <b th:text="${project.customer}"></b></small>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header py-3 px-4">
            <h5 class="mb-0 text-white">Audit log</h5>
            <small class="text-white-50">Complete action history for the project (newest at top)</small>
        </div>
        <div class="card-body p-0">

            <div th:if="${#lists.isEmpty(events)}" class="p-4 text-muted">
                No events yet. As soon as devices are created or started, they appear
                here.
            </div>

            <div th:if="${not #lists.isEmpty(events)}" class="table-responsive">
                <table class="table table-borderless mb-0">
                    <thead>
                    <tr>
                        <th>Time</th>
                        <th>Action</th>
                        <th>Stager</th>
                        <th>Target</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ev : ${events}">
                        <td class="ts" th:text="${ev.formattedTimestamp}"></td>
                        <td>
                            <span class="action-pill"
                                  th:classappend="${ev.actionCssClass}"
                                  th:text="${ev.actionLabel}"></span>
                        </td>
                        <td class="actor" th:text="${ev.actor != null ? ev.actor : '-'}"></td>
                        <td class="target" th:text="${ev.target}"></td>
                        <td class="details" th:text="${ev.details != null ? ev.details : ''}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a href="/devices" class="btn btn-outline-secondary mb-5">Back to overview</a>
</div>

</body>
</html>
