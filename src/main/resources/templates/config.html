
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Config - Staging GUI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; min-height: 100vh; }
        .card { border: none; border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; background: #0f172a; }
        pre {
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 20px 24px;
            font-size: 13px;
            line-height: 1.7;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<nav th:replace="~{navbar :: navbar('device')}"></nav>

<div class="container" style="max-width: 760px;">

    <div class="card shadow-sm mb-4">
        <div class="card-header py-3 px-4 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0 text-white">Generated Configuration</h5>
                <small class="text-white-50" th:text="${device.hostname}"></small>
            </div>
           
        </div>
        <div class="card-body p-4">

            <!-- Device Meta -->
            <div class="row g-2 mb-4">
                <div class="col-auto">
                    <span class="badge bg-light text-dark border">
                        <span th:text="${device.vendor}"></span> <span th:text="${device.model}"></span>
                    </span>
                </div>
                <div class="col-auto">
                    <span class="badge bg-light text-dark border" th:text="'Profile: ' + ${device.configProfile}"></span>
                </div>
                <div class="col-auto">
                    <span class="badge bg-light text-dark border" th:text="'Mode: ' + ${device.configMode}"></span>
                </div>
                <div class="col-auto">
                    <code class="text-muted" th:text="${device.ip}"></code>
                </div>
            </div>

            <pre th:text="${config}"></pre>

            <div class="d-flex gap-2 mt-3">
                <a href="/devices" class="btn btn-outline-secondary">Back to overview</a>
                
            </div>
        </div>
    </div>

</div>

</body>
</html>
