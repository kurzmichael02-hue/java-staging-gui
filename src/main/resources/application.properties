spring.application.name=java-staging-gui

# URL to the ZTP server - /ztp_server has to be included because Apache
# only forwards requests with this path to Flask
ztp.server.baseurl=${ZTP_BASEURL:http://ztp-server.lab.local/ztp_server}

# cisco creds via env var. both required - no default anymore, otherwise
# a weak password or an open community could silently reach real switches.
cisco.admin.password=${ADMIN_PASSWORD}
cisco.snmp.community=${SNMP_COMMUNITY}

# excel upload limits (bulk import)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# H2 file-based persistence. The DB file lands next to the running process.
# The DB_FILE env var can override the path if the data directory should live
# separately.
spring.datasource.url=jdbc:h2:file:${DB_FILE:./staging-gui-db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# metrics baseline: how long the manual staging process took per device.
# estimate from the as-is analysis (thesis, table 5): about 25 min, default 25
app.manual-baseline-minutes-per-device=25

# known stagers in the logicalis team. offered as a dropdown in the device form
# so that not everyone types their name differently (otherwise it skews the metrics).
# comma-separated. if empty -> free-text input instead of dropdown.
app.stagers=Michael Kurz,Max Mustermann,Lena Weber

# suppress the spring-jpa warning. our thymeleaf templates don't render any
# lazy collections, so OSIV (open session in view) has no performance
# consequences here - it only generates a warning at startup
spring.jpa.open-in-view=false

# actuator endpoints for PRTG monitoring (requested by the monitoring team):
# only expose health + info, no metrics/env/etc. (no leak of internals)
# call: GET http://localhost:8080/actuator/health -> {"status":"UP"} if all ok
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Staging GUI
info.app.description=Cisco Catalyst 9000 ZTP-Provisioning
info.app.version=@project.version@