spring.application.name=java-staging-gui

# cisco creds via env var. both required - no default anymore, otherwise
# a weak password or an open community could silently reach real switches.
cisco.admin.password=${ADMIN_PASSWORD}
cisco.snmp.community=${SNMP_COMMUNITY}

# H2 in-memory for now, data is gone on restart. fine while the schema still changes.
spring.datasource.url=jdbc:h2:mem:stagingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
