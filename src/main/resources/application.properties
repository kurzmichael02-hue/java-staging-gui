spring.application.name=java-staging-gui

# URL to the ZTP server - /ztp_server has to be included because Apache
# only forwards requests with this path to Flask
ztp.server.baseurl=${ZTP_BASEURL:http://ztp-server.lab.local/ztp_server}

# cisco creds via env var. both required - no default anymore, otherwise
# a weak password or an open community could silently reach real switches.
cisco.admin.password=${ADMIN_PASSWORD}
cisco.snmp.community=${SNMP_COMMUNITY}

# excel upload limits (bulk import)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# H2 file-based persistence. The DB file lands next to the running process.
# The DB_FILE env var can override the path if the data directory should live
# separately.
spring.datasource.url=jdbc:h2:file:${DB_FILE:./staging-gui-db}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
