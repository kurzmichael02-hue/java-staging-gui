# test overrides: in-memory H2, every test run starts from scratch
spring.datasource.url=jdbc:h2:mem:test-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# don't make a real call to the ZTP server in tests
ztp.server.baseurl=http://localhost:0/dummy

# the admin password has no default in prod anymore (fail-fast). a dummy here
# so the spring context starts in tests, the real one lives only on the VM.
cisco.admin.password=test-admin-pw

# warning suppression as in main, otherwise the spring-boot warning shows in the test log
spring.jpa.open-in-view=false
